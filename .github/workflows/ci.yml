name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTE_FAST_RESEARCH: "1"
  ASTE_SKIP_BENCHMARK: "1"

jobs:
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Repository policy
        run: python3 tools/check_docs.py .
      - name: Formatting
        run: xcrun clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
      - name: Configure
        run: cmake -S . -B ci-core -DCMAKE_BUILD_TYPE=Release
      - name: Static analysis
        run: cmake --build ci-core --target density_static_analysis harmonic_static_analysis
      - name: Build
        run: cmake --build ci-core --parallel 3
      - name: Test
        run: python3 tools/ci_ctest.py ci-core
      - name: Performance sanity
        run: ./ci-core/density_lab --benchmark

  vst3:
    name: VST3 / arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S . -B ci-vst3 -DASTE_BUILD_VST3=ON -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build ci-vst3 --parallel 3
      - name: Test
        run: python3 tools/ci_ctest.py ci-vst3
      - name: Verify bundle signature
        run: |
          codesign --verify --strict --deep "ci-vst3/DensityD01_artefacts/Release/VST3/Density D-01.vst3"
          codesign --verify --strict --deep "ci-vst3/HarmonicH01_artefacts/Release/VST3/Harmonic H-01.vst3"
      - name: Verify universal binary
        run: |
          lipo "ci-vst3/DensityD01_artefacts/Release/VST3/Density D-01.vst3/Contents/MacOS/Density D-01" -verify_arch arm64 x86_64
          lipo "ci-vst3/HarmonicH01_artefacts/Release/VST3/Harmonic H-01.vst3/Contents/MacOS/Harmonic H-01" -verify_arch arm64 x86_64
      - name: Checkout Steinberg VST3 SDK validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: steinbergmedia/vst3sdk
          ref: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
          path: ci-validator-src
          persist-credentials: false
      - name: Checkout Steinberg validator dependencies
        run: git -C ci-validator-src submodule update --init --depth 1 base cmake pluginterfaces public.sdk
      - name: Configure Steinberg validator
        run: >-
          cmake -S ci-validator-src -B ci-validator
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/usr/bin/clang
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSMTG_BUILD_UNIVERSAL_BINARY=OFF
          -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          -DSMTG_ADD_VST3_UTILITIES=OFF
      - name: Build Steinberg validator
        run: cmake --build ci-validator --target validator --parallel 3
      - name: Steinberg extensive validation
        run: |
          ci-validator/bin/Release/validator -e "ci-vst3/DensityD01_artefacts/Release/VST3/Density D-01.vst3"
          ci-validator/bin/Release/validator -e "ci-vst3/HarmonicH01_artefacts/Release/VST3/Harmonic H-01.vst3"
      - name: Build deterministic internal package
        run: cmake --build ci-vst3 --target density_package
      - name: Inspect internal package
        run: >-
          python3 tools/package_density.py verify
          --archive ci-vst3/packages/Density-D01-0.1.0-internal-macos-universal.zip
          --require-clean

  sanitizers:
    name: ASan + UBSan / arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S . -B ci-sanitize -DASTE_BUILD_VST3=ON -DASTE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build ci-sanitize --parallel 3
      - name: Test
        run: python3 tools/ci_ctest.py ci-sanitize
