  <text x="32" y="512" class="secondary">Cycle 3.5 qn</text>
  <rect x="32" y="524" width="80" height="32" class="button"/><text x="42" y="545" class="small">AUDITION</text>
  <text x="128" y="545" class="secondary small">LOCAL OFF</text>
