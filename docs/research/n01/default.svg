  <path d="M526 476V552" stroke="#b2b7bb"/>
  <path d="M32 576H1248" class="rule"/>
  <text x="32" y="606" class="heading">IMPACT / EVENT 2</text>
  <text x="32" y="630" class="secondary">One event selected</text>
  <text x="320" y="606" class="secondary">REPEATS</text><text x="320" y="637">4</text>
  <text x="456" y="606" class="secondary">INTERVAL</text><text x="456" y="637">1/8 qn</text>
  <text x="624" y="606" class="secondary">ACCELERATE</text><text x="624" y="637">× 0.75</text>
  <text x="816" y="606" class="secondary">REPEAT DECAY</text><text x="816" y="637">× 0.80</text>
  <text x="1040" y="606" class="secondary">TIMING</text><text x="1040" y="637">−8.0 ms</text>
  <text x="32" y="672" class="secondary">Select a mark to shape an event. Drag a span to repeat captured audio.</text>
