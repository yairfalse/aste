<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Non-Machine temporal study: default phrase wireframe</title>
  <desc id="desc">Nonfunctional monochrome performance layout. An eight-beat master timeline contains a visible silent span. Three object rows have independent cycles. Event details appear below, while time mode and master actions remain visible.</desc>
  <defs>
    <pattern id="void" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#50565c" stroke-width="1"/></pattern>
    <style>
      text{font-family:Menlo,Consolas,monospace;fill:#eeeae2;font-size:14px}
      .secondary{fill:#b2b7bb}.small{font-size:12px}.heading{font-size:18px;font-weight:bold}.rule{stroke:#777f86;stroke-width:1}.button{fill:#1d2023;stroke:#777f86}.event{fill:#eeeae2}.conditional{fill:none;stroke:#eeeae2;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#151719"/>
  <text x="32" y="44" class="heading">NON-MACHINE / TEMPORAL STUDY</text>
  <text x="860" y="44" class="secondary">N-01 RESEARCH · NOT A PLUGIN</text>
  <path d="M32 64H1248" class="rule"/>
  <text x="32" y="96" class="heading">PHRASE</text>
  <text x="32" y="122" class="secondary">8 quarter notes</text>
  <text x="32" y="147" class="secondary">HOST + PHRASE 2.25</text>
  <text x="256" y="94">1</text><text x="376" y="94">2</text><text x="496" y="94">3</text><text x="616" y="94">4</text><text x="736" y="94">5</text><text x="856" y="94">6</text><text x="976" y="94">7</text><text x="1096" y="94">8</text>
  <rect x="256" y="108" width="960" height="76" fill="#1d2023"/>
  <path d="M256 108V184M376 108V184M496 108V184M616 108V184M736 108V184M856 108V184M976 108V184M1096 108V184M1216 108V184" stroke="#3f454b"/>
  <rect x="736" y="108" width="120" height="76" fill="url(#void)" stroke="#b2b7bb"/>
  <text x="756" y="139">VOID</text><text x="756" y="160" class="small">CUT EDGES</text>
  <path d="M526 103V190" stroke="#eeeae2" stroke-width="2"/>
  <path d="M520 102H532L526 110Z" fill="#eeeae2"/>
  <text x="32" y="214" class="secondary">TIME MODE</text>
  <rect x="168" y="192" width="124" height="36" fill="#eeeae2"/><text x="181" y="215" style="fill:#151719">CONTINUE</text>
  <rect x="292" y="192" width="124" height="36" class="button"/><text x="309" y="215">SUSPEND</text>
  <rect x="456" y="192" width="136" height="36" class="button"/><text x="475" y="215">HOLD MASTER</text>
  <rect x="604" y="192" width="104" height="36" class="button"/><text x="620" y="215">RELEASE</text>
  <rect x="720" y="192" width="104" height="36" class="button"/><text x="738" y="215">REJOIN</text>
  <text x="856" y="215" class="secondary">SOURCE AUDIBLE / ALIGNED</text>
  <path d="M32 248H1248" class="rule"/>
  <text x="32" y="280" class="heading">PRESSURE</text>
  <text x="32" y="304" class="secondary">Cycle 3.0 qn</text>
  <rect x="32" y="316" width="80" height="32" class="button"/><text x="42" y="337" class="small">AUDITION</text>
  <text x="128" y="337" class="secondary small">LOCAL OFF</text>
