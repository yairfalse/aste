  <rect x="566" y="494" width="24" height="28" class="conditional"/>
  <rect x="746" y="494" width="24" height="28" class="conditional"/>
  <rect x="986" y="494" width="24" height="28" class="conditional"/>
  <rect x="1166" y="494" width="24" height="28" class="conditional"/>
