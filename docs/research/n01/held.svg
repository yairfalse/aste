  <path d="M616 476V552" stroke="#eeeae2" stroke-width="2"/>
  <path d="M32 576H1248" class="rule"/>
  <text x="32" y="606" class="heading">MASTER / FRAGMENT</text><text x="32" y="630" class="secondary">Frozen audio selection</text>
  <text x="320" y="606" class="secondary">START</text><text x="320" y="637">1.000 qn</text>
  <text x="488" y="606" class="secondary">LENGTH</text><text x="488" y="637">1.000 qn</text>
  <text x="656" y="606" class="secondary">DIRECTION</text><text x="656" y="637">REVERSE</text>
  <text x="848" y="606" class="secondary">BOUNDARY</text><text x="848" y="637">SOFT</text>
  <text x="1040" y="606" class="secondary">CAPTURE</text><text x="1040" y="637">AVAILABLE</text>
  <text x="32" y="672">Release resumes held phrase. Rejoin realigns to host and clears temporal history.</text>
