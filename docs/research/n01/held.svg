  <rect x="736" y="108" width="120" height="76" fill="url(#void)" stroke="#b2b7bb"/>
  <text x="756" y="139">VOID</text><text x="756" y="160" class="small">CUT EDGES</text>
  <rect x="376" y="108" width="120" height="76" fill="#32373c" stroke="#eeeae2" stroke-width="2"/>
  <path d="M384 152L392 147L398 162L406 124L414 169L422 140L430 154L442 147L450 153L464 149L488 150" fill="none" stroke="#b2b7bb"/>
