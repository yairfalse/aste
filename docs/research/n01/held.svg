<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Non-Machine temporal study: suspended master fragment wireframe</title>
  <desc id="desc">Nonfunctional monochrome wireframe. Master fragment repeats while phrase and local sound state are suspended. Host position keeps advancing. A selected fragment inspector explains release resumes the held phrase, while a separate rejoin action realigns to the host.</desc>
  <defs>
    <pattern id="void" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#50565c" stroke-width="1"/></pattern>
    <style>
      text{font-family:Menlo,Consolas,monospace;fill:#eeeae2;font-size:14px}
      .secondary{fill:#b2b7bb}.small{font-size:12px}.heading{font-size:18px;font-weight:bold}.rule{stroke:#777f86;stroke-width:1}.button{fill:#1d2023;stroke:#777f86}.event{fill:#b2b7bb}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#151719"/>
  <text x="32" y="44" class="heading">NON-MACHINE / TEMPORAL STUDY</text>
  <text x="860" y="44" class="secondary">N-01 RESEARCH · NOT A PLUGIN</text>
