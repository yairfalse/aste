  <path d="M946 103V184" stroke="#b2b7bb" stroke-width="2" stroke-dasharray="4 4"/><text x="956" y="177" class="small">HOST</text>
  <text x="32" y="214" class="secondary">TIME MODE</text>
  <rect x="168" y="192" width="124" height="36" class="button"/><text x="181" y="215">CONTINUE</text>
  <rect x="292" y="192" width="124" height="36" fill="#eeeae2"/><text x="309" y="215" style="fill:#151719">SUSPEND</text>
  <rect x="456" y="192" width="136" height="36" fill="#eeeae2"/><text x="479" y="215" style="fill:#151719">HELD / LATCH</text>
  <rect x="604" y="192" width="104" height="36" class="button"/><text x="620" y="215">RELEASE</text>
  <rect x="720" y="192" width="104" height="36" class="button"/><text x="738" y="215">REJOIN</text>
